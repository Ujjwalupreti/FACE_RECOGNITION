<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Attendance System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>

  <header class="navbar glass">
    <div class="logo-placeholder">
      <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo" class="logo">
    </div> 
    <nav>
      <a href="#register">Register</a>
      <a href="#attendance">Mark Attendance</a>
      <a href="#user-info">User Info</a>
    </nav>
  </header>

  <main>
    <section id="register" class="glass card">
      <h2>Register Student</h2>
      <form id="registerForm">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="roll" placeholder="Roll Number" required>
        <input type="text" name="course" placeholder="Course" required>
        <input type="file" name="image" accept="image/*" required>
        <button type="submit" class="button primary-button">Register Student</button>
      </form>
      <div id="registerResult"></div>
    </section>

    <section id="attendance" class="glass card">
      <h2>Mark Attendance</h2>
      <div id="videoBox" class="glass">
        <video id="webcam" autoplay playsinline></video>
      </div>
      <canvas id="snapshot" style="display:none;"></canvas>
      <p id="para">Start the camera, frame your face, then capture!</p>
      <div class="button-group">
        <button id="startCamBtn" class="button">Start Camera</button>
        <button id="captureBtn" class="button primary-button" disabled>Capture & Submit</button>
      </div>
    </section>

    <section id="user-info" class="glass card">
      <h2>Student Information</h2>
      <form id="userInfoForm">
        <input type="text" id="rollSearch" placeholder="Enter Student Roll Number" required>
        <button type="submit" class="button">Search Student</button>
      </form>
      <div id="userInfoResult"></div>
      
      <div class="chart-container" style="display: flex; justify-content: center; margin-top: 1rem;">
          <canvas id="attendanceChart" width="200" height="200"></canvas>
      </div>
      <button id="downloadCsvBtn" class="button primary-button" style="margin-top:1rem; display:none;">Download CSV</button>
    </section>
  </main>
  <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
